<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThisIsIver34 // Admin </title>
    <style>
        body {
            margin-left: 3vh;
            background-color: #BF8764;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        h1 {
            font-size: 40px;
        }
        button {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            height: 5vh;
            margin-top: 1vh;
        }
        ::placeholder {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .main {
            display: flex;
            flex-direction: column;
            max-width: 50%;
        }

        .main-buttons {
            margin-top: 1vh;
            width: 20%;
        }


        div.new_post {
            flex-direction:column; 
            display: none;
            padding: 1.5rem;
            margin: 0;
            max-width: 600px;
        }

        .post-buttons {
            width: 30%;
            margin-top: 0.5vh;
            min-height: 2vh;
            max-height: 3vh;
        }

        .post-text {
            min-height: 50vh;
            max-height: 70vh;
            resize: vertical;
            width: 100%;
        }

        #postTitle {
            min-height: 2vh;
            width: 100%;
        }

        @media (max-width: 420px) {
            h1 {
                font-size: 24px;
            }
            .main-buttons {
                width: 15vh;
                height: 4vh;
            }
            .post-buttons {
                width: 7.5vh;
            }
            div.new_post {
                padding: 0;
                width: 100%;
                align-items: center;
            }

            .post-text {
                margin: 0;
                width: 200%;
                box-sizing: border-box;
            }

            #postTitle {
                margin: 0;
                width: 200%;
                box-sizing: border-box;
            }
        } /*end of post text css */
        
        #edit_post_list {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            gap: 5vh;
        }
        .edit_prev_posts-full {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            gap: 2px;
        }
        .edit-post-text {
            width: 80%;
        }
        #editContent {
            height: 30vh;
        }
        .edit_title-buttons {
            display: none;
            flex-direction: column;
            width: 10vh;
            height: 3vh;
            margin-top: 1vh;
            margin-left: 1vh;
        }
        .delete-btn {
            margin-left: 1vh;
        }
    </style>
</head>
<body>
    <h1>Welcome Back.</h1>
<div class="main">

    <button onclick="showForm()" class="main-buttons">New Post</button>

    <div class="new_post" id="new_post">
        <input class="post-text" id="postTitle" placeholder="Enter Title Here">
        <textarea class="post-text" name="postContent" id="postContent" placeholder="Write your post..."></textarea>
        <button class="post-buttons" onclick="savePost()">Publish</button>
        <button class="post-buttons" onclick="hideForm()">Close</button>    
    </div>

    <button onclick="showEdit()" class="main-buttons">Edit Previous Posts</button>
<div class="edit_and_delete">
    <div class="edit_prev_posts-title" id="edit_post_list"> 
    </div>

    <button class="edit_title-buttons" id="edit_post_list-button" onclick="hideEditPostList()">Close</button>   

    <div class="edit_prev_posts-full" id="editForm">
        <input class="edit-post-text" id="editTitle">
        <p id="editDateDisplay" style="color: #666; font-size: 0.9rem; margin-bottom: 0.5rem;"></p>
        <textarea class="edit-post-text" id="editContent"></textarea>
        <input type="hidden" id="editIndex" value="">
        <div class="edit-actions">
            <button class="edit-buttons save-btn" onclick="confirmEditPost()">Save Changes</button>
            <button class="edit-butons cancel-btn" onclick="hideEditPost()">Cancel</button>
        </div>
    </div>
    </div>
</div>
  

    <script>
        function showForm() {
            document.getElementById('new_post').style.display = 'block';
        }
        function hideForm() {
            document.getElementById('new_post').style.display = 'none';
        }
        function savePost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
    
            if (title === '' || content === '') {
                alert('Please fill in both fields.');
                return;
            }

            const post = {
                title: title,
                content: content,
                date: new Date().toLocaleDateString(),
                lastEdited: null
            };

            saveToStorage(post);
        }
        function saveToStorage(post) {
            let posts = localStorage.getItem('blogPosts');
            if (!posts || posts === 'undefined') {
                posts = [];
            } else {
                posts = JSON.parse(posts);
            }
            posts.unshift(post);
            localStorage.setItem('blogPosts', JSON.stringify(posts));

            alert('Your blog post has been published.')
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            hideForm();
        } //end of new post
        
        function showEdit() {
            document.getElementById('edit_post_list').style.display = 'block';
            document.getElementById('edit_post_list-button').style.display = 'block';
            document.getElementById('editForm').style.display = 'none';
            loadPostsList();
        }

        function loadPostsList() {
            const container = document.getElementById('edit_post_list')
            const posts = localStorage.getItem('blogPosts') 

            if (!posts || posts === 'undefined') {
                container.innerHTML = '<p>No posts to edit.</p>';
                return;
            }


            //delete posts js made HTML

            const blogPosts = JSON.parse(posts);
            container.innerHTML = '';

            blogPosts.forEach((post, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'edit-item';

                const titleBtn = document.createElement('button');
                titleBtn.className = 'edit-item-title';
                titleBtn.textContent = post.title;
                titleBtn.onclick = function() {
                    openEditForm(index);
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = function() {
                    deletePost(index);
                };
                itemDiv.appendChild(titleBtn);
                itemDiv.appendChild(deleteBtn);
                container.appendChild(itemDiv);
            });
        }
        
        function openEditForm(index) {
            const posts = localStorage.getItem('blogPosts');
            if (posts === null) return;

            const blogPosts = JSON.parse(posts);
            const post = blogPosts[index];

            document.getElementById('editTitle').value = post.title;
            document.getElementById('editContent').value = post.content;
            document.getElementById('editIndex').value = index;

            if (post.lastEdited) {
                document.getElementById('editDateDisplay').textContent = `Last edited: ${post.lastEdited}`;
                document.getElementById('editDateDisplay').style.display = 'block';
            } else {
                document.getElementById('editDateDisplay').style.display = 'none';
            }

            document.getElementById('editForm').style.display = 'block';

            document.getElementById('editForm').scrollIntoView({ behavior: 'smooth'});
        }
        
        function confirmEditPost() {
            const index = document.getElementById('editIndex').value;
            if (index === '') {
                alert('No post selected for editing.');
                return;
            }

            const newTitle = document.getElementById('editTitle').value;
            const newContent = document.getElementById('editContent').value;

            if (newTitle === '' || newContent === '') {
                alert('Please fill in both fields.');
                return;
            }

            let posts = localStorage.getItem('blogPosts');
            if (posts === null) return;

            const blogPosts = JSON.parse(posts);

            blogPosts[index].title = newTitle;
            blogPosts[index].content = newContent;
            blogPosts[index].date = blogPosts[index].date;
            blogPosts[index].lastEdited = new Date().toLocaleDateString();

            localStorage.setItem('blogPosts', JSON.stringify(blogPosts));

            document.getElementById('editForm').style.display = 'none';

            loadPostsList();

            alert('Post updated!');
        }

       

        function hideEditPostList() {
            document.getElementById('edit_post_list').style.display = 'none';
            document.getElementById('edit_post_list-button').style.display = 'none';
        }

        function hideEditPost() {
            document.getElementById('editForm').style.display = 'none';
        }


        function deletePost(index) {
            if (!confirm('Are you sure you want to delete this post?')) {
                return;
            }

            let posts = localStorage.getItem('blogPosts');
            if (posts === null) return;

            const blogPosts = JSON.parse(posts);
            blogPosts.splice(index, 1);
            localStorage.setItem('blogPosts', JSON.stringify(blogPosts));

            loadPostsList();
            alert('Post deleted.');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideForm();
                hideEditPost();
            }
        })
    </script>
</body>
</html>
